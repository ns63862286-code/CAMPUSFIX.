<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusFix - University Problem Reporting & Resolution Platform</title>
  
  <!-- Favicon SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4'/></svg>" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Custom Theme Stylesheet -->
  <link rel="stylesheet" href="/css/style.css" />

  <!-- React 18, ReactDOM 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen">
  <!-- React Root Container -->
  <div id="root">
    <!-- Initial Loading State while Babel compiles components -->
    <div class="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50 text-center">
      <div class="w-14 h-14 rounded-2xl bg-blue-600 flex items-center justify-center text-white shadow-xl shadow-blue-500/25 mb-4 animate-bounce">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
        </svg>
      </div>
      <h2 class="text-xl font-extrabold text-slate-900">CampusFix</h2>
      <p class="text-xs text-slate-500 mt-1 max-w-xs">Initializing campus problem reporting engine & university database...</p>
    </div>
  </div>

  <!-- API Client Script -->
  <script src="/js/api.js"></script>

  <!-- React Components (Compiled via Babel) -->
  <script type="text/babel" src="/js/components/Toast.js"></script>
  <script type="text/babel" src="/js/components/Navbar.js"></script>
  <script type="text/babel" src="/js/components/HeroBanner.js"></script>
  <script type="text/babel" src="/js/components/FilterBar.js"></script>
  <script type="text/babel" src="/js/components/ComplaintCard.js"></script>
  <script type="text/babel" src="/js/components/ComplaintDetailModal.js"></script>
  <script type="text/babel" src="/js/components/ComplaintForm.js"></script>
  <script type="text/babel" src="/js/components/AdminDashboard.js"></script>
  <script type="text/babel" src="/js/components/AnalyticsView.js"></script>
  <script type="text/babel" src="/js/components/AuthModal.js"></script>

  <!-- Main React App Entrypoint -->
  <script type="text/babel" src="/js/app.js"></script>
</body>
</html>
